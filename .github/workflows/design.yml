name: Design consistency

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  design-tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Verify shared web and mobile tokens
        run: node scripts/sync-design-tokens.mjs --check
