[tools]
node = "22.22.0"
java = "temurin-21.0.9+10"

[tasks."web:install"]
dir = "apps/web"
run = "npm ci"

[tasks."mobile:install"]
dir = "apps/mobile"
run = "npm ci"

[tasks.setup]
description = "Install dependencies for web and mobile"
depends = ["web:install", "mobile:install"]

[tasks."db:up"]
dir = "apps/api"
run = "docker compose up -d --wait postgres"

[tasks."db:stop"]
dir = "apps/api"
run = "docker compose stop postgres"

[tasks."api:dev"]
dir = "apps/api"
env = { SPRING_PROFILES_ACTIVE = "dev" }
run = '''
set -a
if [ -f .env ]; then . ./.env; fi
set +a
exec ./mvnw spring-boot:run
'''

[tasks."web:dev"]
dir = "apps/web"
run = "npm run dev"

[tasks."mobile:dev"]
dir = "apps/mobile"
run = "npm start"

[tasks."api:test"]
dir = "apps/api"
env = { SPRING_PROFILES_ACTIVE = "dev" }
run = "./mvnw -B test"

[tasks."web:build"]
dir = "apps/web"
run = "npm run build"

[tasks."web:test"]
dir = "apps/web"
run = "npm test"

[tasks."mobile:typecheck"]
dir = "apps/mobile"
run = "npm exec --no -- tsc --noEmit"

[tasks.check]
description = "Run API tests, build web, and type-check mobile"
depends = ["api:test", "web:test", "web:build", "mobile:typecheck"]

[tasks."stack:up"]
description = "Build and start the UI, API, Expo, and PostgreSQL containers"
run = '''
set -e
if [ ! -f apps/api/.env ]; then
  cp -n apps/api/.env.example apps/api/.env
fi
docker compose --env-file apps/api/.env up -d --build
'''

[tasks."stack:down"]
description = "Stop the Docker stack and keep its database volume"
run = "docker compose --env-file apps/api/.env down"
