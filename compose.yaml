name: smart-finances

x-client-build: &client-build
  dockerfile_inline: |
    FROM node:22.22.0-bookworm-slim
    WORKDIR /app
    COPY package.json package-lock.json ./
    RUN npm ci
    COPY . .

services:
  ui:
    build:
      <<: *client-build
      context: ./apps/web
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--strictPort"]
    ports:
      - "127.0.0.1:5173:5173"

  api:
    build: ./apps/api
    env_file: ./apps/api/.env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in apps/api/.env}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  mobile:
    build:
      <<: *client-build
      context: ./apps/mobile
    command: ["npm", "start", "--", "--lan", "--port", "8081"]
    environment:
      CI: "1"
      REACT_NATIVE_PACKAGER_HOSTNAME: ${SMART_FINANCES_HOST:-localhost}
      EXPO_PUBLIC_API_URL: http://${SMART_FINANCES_HOST:-localhost}:8080
    ports:
      - "8081:8081"

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in apps/api/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in apps/api/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in apps/api/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
